<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAUNTED HOUSE — 150 Levels</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#eee;font-family:Arial,sans-serif;text-align:center}
header{padding:14px;background:#14191f;border-bottom:1px solid #39414b}h1{margin:4px;color:#e9dddd;letter-spacing:4px}
#hud{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:10px}
.pill{background:#1b222a;border:1px solid #48515c;border-radius:20px;padding:8px 13px}
main{max-width:850px;margin:auto;padding:10px}
canvas{width:min(94vw,640px);height:min(94vw,640px);max-height:640px;background:#101519;border:2px solid #59616a;border-radius:8px;display:block;margin:8px auto;touch-action:none}
button{background:#8e2525;color:white;border:0;border-radius:8px;padding:11px 17px;font-size:15px;margin:4px;cursor:pointer}
button:disabled{opacity:.4}.help{color:#b9c1ca;font-size:14px;line-height:1.6}
#controls{display:grid;grid-template-columns:repeat(3,56px);gap:5px;justify-content:center;margin:10px}
#controls button{padding:13px 0;margin:0;font-size:20px;background:#29333d}
#message{min-height:26px;color:#ffd37a;font-weight:bold}
</style></head>
<body>
<header><h1>HAUNTED HOUSE</h1><div>ESCAPE THE HOUSE • 150 LEVELS</div></header>
<div id="hud">
 <span class="pill" id="level">Level 1 / 150</span><span class="pill" id="keys">🔑 Key: 0/1</span>
 <span class="pill" id="status">Find the key!</span>
</div>
<main>
<canvas id="game" width="640" height="640" aria-label="Haunted House game"></canvas>
<div id="message">चाबी खोजें और EXIT तक पहुँचें। भूत से बचकर रहें!</div>
<button id="start">Start / Resume</button><button id="restart">Restart Level</button>
<div id="controls">
 <span></span><button data-dir="up">▲</button><span></span>
 <button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button>
</div>
<p class="help">कंप्यूटर: Arrow Keys या WASD से चलें। मोबाइल: नीचे दिए बटन दबाएँ।<br>हर लेवल में चाबी लेकर EXIT तक जाएँ। यह डरावना maze-escape गेम है; कोई खून-खराबा नहीं।</p>
</main>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const N=16,S=40;
let level=1,maze=[],player={x:1,y:1},ghost={x:14,y:14},key={x:5,y:5},exit={x:14,y:1};
let hasKey=false,running=false,won=false,frame=0,moveLock=0,ghostTick=0;
const $=id=>document.getElementById(id);
function rand(n){return Math.floor(Math.random()*n)}
function generate(){
 maze=Array.from({length:N},()=>Array(N).fill(1));
 // randomized depth-first maze; level increases ghost speed and maze complexity
 let stack=[[1,1]];maze[1][1]=0;
 while(stack.length){
  let [x,y]=stack[stack.length-1],dirs=[[0,-2],[2,0],[0,2],[-2,0]].sort(()=>Math.random()-.5);
  let next=dirs.map(([dx,dy])=>[x+dx,y+dy,dx,dy]).find(([nx,ny])=>nx>0&&ny>0&&nx<N-1&&ny<N-1&&maze[ny][nx]===1);
  if(next){let[nx,ny,dx,dy]=next;maze[y+dy/2][x+dx/2]=0;maze[ny][nx]=0;stack.push([nx,ny])}
  else stack.pop();
 }
 // Open a few extra passages at higher levels
 for(let i=0;i<Math.min(18,Math.floor(level/8));i++){let x=1+rand(N-2),y=1+rand(N-2);maze[y][x]=0}
 player={x:1,y:1};exit={x:N-2,y:N-2};maze[exit.y][exit.x]=0;
 ghost={x:N-2,y:1};maze[ghost.y][ghost.x]=0;
 do{key={x:1+rand(N-2),y:1+rand(N-2)}}while(maze[key.y][key.x]||same(key,player)||same(key,exit)||same(key,ghost));
 hasKey=false;won=false;running=false;frame=0;ghostTick=0;
 // ensure a route to exit and key via the maze; all carved cells connect
 updateHud();draw();
 $('message').textContent='चाबी खोजें और EXIT तक पहुँचें।';
}
function same(a,b){return a.x===b.x&&a.y===b.y}
function updateHud(){
 $('level').textContent=`Level ${level} / 150`;
 $('keys').textContent=`🔑 Key: ${hasKey?1:0}/1`;
 $('status').textContent=running?'Escaping...':'Ready';
}
function draw(){
 ctx.fillStyle='#080c10';ctx.fillRect(0,0,640,640);
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  if(maze[y][x]){ctx.fillStyle='#303943';ctx.fillRect(x*S,y*S,S,S);ctx.strokeStyle='#424c57';ctx.strokeRect(x*S+2,y*S+2,S-4,S-4)}
  else{ctx.fillStyle=(x+y)%2?'#151e23':'#182126';ctx.fillRect(x*S,y*S,S,S)}
 }
 // exit
 ctx.fillStyle=hasKey?'#25a45b':'#6b4930';ctx.fillRect(exit.x*S+7,exit.y*S+5,26,31);
 ctx.fillStyle='#fff';ctx.font='11px Arial';ctx.fillText('EXIT',exit.x*S+5,exit.y*S+39);
 if(!hasKey){ctx.fillStyle='#ffd34d';ctx.font='26px Arial';ctx.fillText('🔑',key.x*S+7,key.y*S+29)}
 // player
 ctx.fillStyle='#57b7ff';ctx.beginPath();ctx.arc(player.x*S+20,player.y*S+20,12,0,Math.PI*2);ctx.fill();
 ctx.fillStyle='#06121c';ctx.fillRect(player.x*S+14,player.y*S+16,4,4);ctx.fillRect(player.x*S+23,player.y*S+16,4,4);
 // ghost
 ctx.fillStyle='#d9dce5';ctx.beginPath();ctx.arc(ghost.x*S+20,ghost.y*S+18,13,Math.PI,0);ctx.lineTo(ghost.x*S+33,ghost.y*S+32);ctx.lineTo(ghost.x*S+27,ghost.y*S+27);ctx.lineTo(ghost.x*S+20,ghost.y*S+33);ctx.lineTo(ghost.x*S+13,ghost.y*S+27);ctx.lineTo(ghost.x*S+7,ghost.y*S+32);ctx.closePath();ctx.fill();
 ctx.fillStyle='#a22';ctx.fillRect(ghost.x*S+13,ghost.y*S+16,4,5);ctx.fillRect(ghost.x*S+23,ghost.y*S+16,4,5);
 // dark vignette / limited flashlight
 ctx.save();ctx.globalCompositeOperation='source-atop';
 let g=ctx.createRadialGradient(player.x*S+20,player.y*S+20,70,player.x*S+20,player.y*S+20,310);
 g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.55)');
 ctx.fillStyle=g;ctx.fillRect(0,0,640,640);ctx.restore();
}
function move(dx,dy){
 if(!running||won||moveLock>0)return;
 let nx=player.x+dx,ny=player.y+dy;
 if(nx>=0&&ny>=0&&nx<N&&ny<N&&!maze[ny][nx]){player={x:nx,y:ny};moveLock=5;
  if(same(player,key)&&!hasKey){hasKey=true;$('message').textContent='चाबी मिल गई! अब EXIT पर जाएँ।';updateHud()}
  if(hasKey&&same(player,exit)){won=true;running=false;$('message').textContent=level===150?'🏆 आपने HAUNTED HOUSE पूरा कर लिया!':'🎉 Level complete! अगला लेवल खुल गया।';if(level<150){level++;setTimeout(generate,1100)}else $('status').textContent='Completed'}
 }
 draw();
}
function ghostStep(){
 if(!running||won)return;
 // Ghost follows by taking a valid step toward player; speed rises with level.
 let opts=[[0,-1],[1,0],[0,1],[-1,0]].map(([dx,dy])=>({x:ghost.x+dx,y:ghost.y+dy}));
 opts=opts.filter(p=>p.x>=0&&p.y>=0&&p.x<N&&p.y<N&&!maze[p.y][p.x]);
 opts.sort((a,b)=>(Math.abs(a.x-player.x)+Math.abs(a.y-player.y))-(Math.abs(b.x-player.x)+Math.abs(b.y-player.y)));
 if(opts.length&&Math.random()<.82)ghost=opts[0];
 if(same(ghost,player)){running=false;$('message').textContent='भूत ने रास्ता रोक लिया! Restart दबाकर फिर कोशिश करें।';$('status').textContent='Try again'}
 draw();
}
function tick(){if(moveLock>0)moveLock--;if(running){frame++;if(frame%(Math.max(5,22-Math.floor(level/10)))===0)ghostStep()}}
setInterval(tick,90);
const dirs={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};
document.addEventListener('keydown',e=>{if(dirs[e.key]){e.preventDefault();move(...dirs[e.key])}if(e.key===' '){running=!running;updateHud()}});
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('click',()=>{let d=b.dataset.dir;move(...({up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d]))}));
$('start').onclick=()=>{if(!won){running=true;updateHud();$('message').textContent='सावधान! भूत आपका पीछा कर रहा है।'}};
$('restart').onclick=()=>generate();
generate();
</script></body></html>
